<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên mật khẩu — Video Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="login.html" class="auth-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <span>Video Admin</span>
        </a>
        <h1 class="auth-title">Quên mật khẩu</h1>
        <p class="auth-desc">Nhập email để nhận liên kết khôi phục mật khẩu</p>
      </div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email tài khoản <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="admin1@gmail.com" required autocomplete="email">
          <div class="form-error" id="emailError"></div>
        </div>

        <div style="margin-top: var(--space-5);">
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Gửi yêu cầu</button>
        </div>
      </form>

      <div class="auth-footer">
        <a href="login.html">Quay lại Đăng nhập</a>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/forgotPassword.js"></script>
</body>
</html>
