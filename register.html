<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — Video Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="login.html" class="auth-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <span>Video Admin</span>
        </a>
        <h1 class="auth-title">Đăng ký tài khoản</h1>
        <p class="auth-desc">Tạo tài khoản người dùng mới</p>
      </div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Tên người dùng (Username) <span class="required">*</span></label>
          <input type="text" id="username" class="form-control" placeholder="user_demo" required autocomplete="username">
          <div class="form-helper">3–30 ký tự, chỉ gồm chữ, số và dấu gạch dưới</div>
          <div class="form-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email <span class="required">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="user@example.com" required autocomplete="email">
          <div class="form-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Mật khẩu <span class="required">*</span></label>
          <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password">
          <div class="form-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Xác nhận mật khẩu <span class="required">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
          <div class="form-error" id="confirmPasswordError"></div>
        </div>

        <div style="margin-top: var(--space-5);">
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Tạo tài khoản</button>
        </div>
      </form>

      <div class="auth-footer">
        <span>Đã có tài khoản?</span>
        <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/pages/register.js"></script>
</body>
</html>
