<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông tin Video — Video Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .form-container {
      max-width: 720px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .thumb-preview-box {
      width: 240px;
      height: 135px;
      background: var(--bg-hover);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: var(--space-2);
    }
    .thumb-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .source-panel {
      padding: var(--space-4);
      background: var(--bg-subtle);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-top: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <!-- Main Content -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar"></header>

      <!-- Nội dung trang -->
      <main class="content">
        <div class="page-header">
          <h1 class="page-title" id="formPageTitle">Thêm video mới</h1>
          <a href="videos.html" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
        </div>

        <div class="form-container">
          <form id="videoForm" novalidate>
            <!-- Title -->
            <div class="form-group">
              <label for="title" class="form-label">Tiêu đề video <span class="required">*</span></label>
              <input type="text" id="title" class="form-control" placeholder="Nhập tiêu đề video (tối đa 150 ký tự)" required maxlength="150">
              <div class="form-error" id="titleError"></div>
            </div>

            <!-- Description -->
            <div class="form-group">
              <label for="description" class="form-label">Mô tả video</label>
              <textarea id="description" class="form-control" placeholder="Mô tả nội dung chi tiết..." maxlength="2000"></textarea>
              <div class="form-helper">Tối đa 2000 ký tự</div>
            </div>

            <!-- Category & Status -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="form-group">
                <label for="categoryId" class="form-label">Danh mục</label>
                <select id="categoryId" class="form-control">
                  <option value="">-- Chọn danh mục --</option>
                </select>
              </div>

              <div class="form-group">
                <label for="status" class="form-label">Trạng thái <span class="required">*</span></label>
                <select id="status" class="form-control">
                  <option value="PUBLISHED" selected>Published (Công khai)</option>
                  <option value="DRAFT">Draft (Bản nháp)</option>
                  <option value="HIDDEN">Hidden (Ẩn)</option>
                </select>
              </div>
            </div>

            <!-- Nguồn video (Upload vs URL) -->
            <div class="form-group" style="margin-top: var(--space-3);">
              <label class="form-label">Nguồn phát video <span class="required">*</span></label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="sourceType" value="URL" checked>
                  Dán đường dẫn (URL)
                </label>
                <label class="radio-label">
                  <input type="radio" name="sourceType" value="UPLOAD">
                  Tải lên tệp video
                </label>
              </div>

              <!-- Panel nguồn URL -->
              <div id="urlSourcePanel" class="source-panel">
                <label for="videoUrlInput" class="form-label">Đường dẫn video (URL) <span class="required">*</span></label>
                <input type="url" id="videoUrlInput" class="form-control" placeholder="https://example.com/video.mp4">
                <div class="form-error" id="videoUrlError"></div>
              </div>

              <!-- Panel nguồn Upload -->
              <div id="uploadSourcePanel" class="source-panel hidden">
                <label for="videoFileInput" class="form-label">Chọn tệp video từ máy <span class="required">*</span></label>
                <input type="file" id="videoFileInput" class="form-control" accept="video/mp4,video/webm,video/quicktime">
                <div class="form-helper">Định dạng hỗ trợ: .mp4, .webm, .mov (tối đa 50 MB)</div>
                <div id="currentVideoFileNotice" class="text-muted hidden" style="font-size: 12px; margin-top: 4px;"></div>
                <div class="form-error" id="videoFileError"></div>
              </div>
            </div>

            <!-- Thumbnail -->
            <div class="form-group" style="margin-top: var(--space-3);">
              <label class="form-label">Ảnh thu nhỏ (Thumbnail)</label>
              <div class="radio-group" style="margin-bottom: var(--space-2);">
                <label class="radio-label">
                  <input type="radio" name="thumbSource" value="URL" checked>
                  Dán URL ảnh
                </label>
                <label class="radio-label">
                  <input type="radio" name="thumbSource" value="UPLOAD">
                  Tải lên tệp ảnh
                </label>
              </div>

              <!-- Thumbnail URL -->
              <div id="thumbUrlPanel">
                <input type="url" id="thumbUrlInput" class="form-control" placeholder="https://example.com/thumb.jpg">
              </div>

              <!-- Thumbnail Upload -->
              <div id="thumbUploadPanel" class="hidden">
                <input type="file" id="thumbFileInput" class="form-control" accept="image/jpeg,image/png,image/webp">
                <div class="form-helper">Định dạng hỗ trợ: .jpg, .png, .webp (tối đa 5 MB)</div>
              </div>

              <!-- Preview thumbnail -->
              <div class="thumb-preview-box">
                <img id="thumbPreviewImg" src="" alt="Xem trước thumbnail" class="thumb-preview-img hidden">
                <span id="thumbPreviewPlaceholder" class="text-muted" style="font-size: 13px;">Chưa có ảnh</span>
              </div>
            </div>

            <!-- Nút hành động -->
            <div style="display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6); border-top: 1px solid var(--border); padding-top: var(--space-4);">
              <a href="videos.html" class="btn btn-secondary">Hủy</a>
              <button type="submit" id="saveBtn" class="btn btn-primary">Lưu video</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/pages/videoForm.js"></script>
</body>
</html>
